<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="MGO Tracker">
<title>MGO Tracker</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<script>try{const v=localStorage.getItem('mgo_unified_version');if(v)document.documentElement.classList.add(v+'-mode');const c=JSON.parse(localStorage.getItem('mgo_cfg'));if(c&&c.ambiance===4){const Rnd=(s)=>function(){var t=s+=1831565813;return t=Math.imul(t^t>>>15,1|t),(((t^=t+Math.imul(t^t>>>7,61|t))^t>>>14)>>>0)/4294967296};if(Rnd(c.seed||Date.now())()<0.01)document.documentElement.classList.add('is-shiney');}}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
</head>
<body>
<div id="__hub"><div class="hub-orb" style="width:38vw;height:38vw;top:-8%;left:-10%;background:radial-gradient(circle,rgba(99,102,241,.35) 0%,transparent 70%);--d:20s;--tx:6vw;--ty:8vh"></div><div class="hub-orb" style="width:30vw;height:30vw;top:55%;right:-8%;background:radial-gradient(circle,rgba(244,114,182,.28) 0%,transparent 70%);--d:16s;--tx:-8vw;--ty:-6vh"></div><div class="hub-orb" style="width:22vw;height:22vw;bottom:-5%;left:30%;background:radial-gradient(circle,rgba(251,191,36,.22) 0%,transparent 70%);--d:24s;--tx:5vw;--ty:-5vh"></div><div class="hub-orb" style="width:18vw;height:18vw;top:20%;right:5%;background:radial-gradient(circle,rgba(99,102,241,.2) 0%,transparent 70%);--d:14s;--tx:-4vw;--ty:7vh"></div>
  <div id="__hub-card"><div class="hub-deck"><div class="hub-dc hub-dc1"></div><div class="hub-dc hub-dc2">🎲</div><div class="hub-dc hub-dc3"></div></div><h2>MGO Tracker</h2><p id="__hub-sub">Choisissez la version à démarrer</p><button class="hub-btn hub-btn-full" onclick="__pickVersion('full',this)"><span class="hub-btn-icon">⚡</span><span class="hub-btn-texts"><span class="hub-btn-lbl" id="__hub-lbl-full">Version Complète</span><span class="hub-btn-desc" id="__hub-desc-full">Ambiance animée · Effets visuels · Toutes les fonctionnalités</span></span><span class="hub-btn-arr">›</span></button><button class="hub-btn hub-btn-lite" onclick="__pickVersion('lite',this)"><span class="hub-btn-icon">🪶</span><span class="hub-btn-texts"><span class="hub-btn-lbl" id="__hub-lbl-lite">Version Lite</span><span class="hub-btn-desc" id="__hub-desc-lite">Interface légère · Démarrage rapide · Même tracker</span></span><span class="hub-btn-arr">›</span></button></div>
</div>
<div class="ambient-bg" id="ambient-bg"></div>
<div id="splash"><div class="sp-deck"><div class="sp-c"></div><div class="sp-c">★</div><div class="sp-c"></div></div><div class="sp-title">MGO <em>Tracker</em><span>.</span></div><div class="sp-hint">Chargement en cours…</div></div>
<div id="toast">Sauvegardé !</div>
<div id="setup-mod"><div class="setup-card"><div class="setup-title" data-i18n="new_season"></div><p style="text-align:center;color:var(--txt-dim);font-size:0.9rem;margin:0" data-i18n="setup_board"></p><div class="setup-grp"><button class="mini-btn" data-action="open-users" style="justify-content:center;padding:10px;font-size:0.9rem" data-i18n="manage_list"></button></div><div class="setup-grp"><label><span data-i18n="num_albums"></span> <span id="s-alb-val" style="color:var(--p)">24</span></label><input type="range" id="s-alb" min="21" max="26" value="24" style="width:100%;accent-color:var(--p)"></div><div class="setup-grp" style="flex:1;overflow:hidden;display:flex;flex-direction:column"><label><span data-i18n="gold_cards"></span> <span style="font-weight:400;font-size:0.7rem;opacity:0.7" data-i18n="click_activate"></span></label><div id="setup-gold-grid" style="overflow-y:auto;padding:5px;flex:1;border:1px solid var(--glass-b);border-radius:12px;background:rgba(0,0,0,0.2)"></div></div><button class="big-btn" id="btn-start-season" data-i18n="start_season"></button></div></div>
<div class="dock-wrap"><div class="dock">
  <button class="dock-btn" data-action="toggle-menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2m0 5h18v2H3v-2m0 5h18v2H3v-2z"/></svg><span class="dock-label" data-i18n="menu"></span></button>
  <button class="dock-btn" data-action="undo"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span class="dock-label" data-i18n="undo"></span></button>
  <button class="dock-btn" data-action="open-gold-mod" style="color:var(--gold)"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span class="dock-label" data-i18n="gold_setup"></span></button>
  <button class="dock-btn" data-action="open-missions" style="color:#a78bfa"><svg viewBox="0 0 24 24"><path d="M17 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4V1h2v2h6V1h2v2zm-2 2H9v2H7V5H4v4h16V5h-3v2h-2V5zm5 6H4v8h16v-8zM6 14h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg><span class="dock-label">Missions</span></button>
  <button class="dock-btn" data-action="toggle-view"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg><span class="dock-label" data-i18n="view"></span></button>
</div></div>
<div id="pop-menu" class="popover">
  <div style="padding:10px;font-size:0.8rem;opacity:0.6;text-transform:uppercase;font-weight:700" data-i18n="menu"></div>
  <div class="menu-item"><span><span data-i18n="albums"></span> <b id="lbl-alb">24</b></span><input type="range" id="sl-alb" min="21" max="26" style="width:100px; accent-color:var(--p)"></div>
  <div class="menu-item no-hover" data-full-only style="cursor:default;user-select:none;padding-top:6px;padding-bottom:6px">
    <span data-i18n="ambiance"></span>
    <div id="amb-sel" style="display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap"></div>
  </div>
  <hr style="border:0;border-top:1px solid var(--glass-b);margin:5px 0">
  <div class="menu-item" data-action="toggle-print-sub"><span data-i18n="print"></span><span style="font-size:0.8rem;opacity:0.6">▼</span></div>
  <div id="sub-print" style="display:none;flex-direction:column;gap:2px;background:rgba(0,0,0,0.2);padding:8px;border-radius:8px;margin-bottom:8px"></div>
  <div class="menu-item" data-action="save-file"><span data-i18n="save_file"></span></div>
  <div class="menu-item" data-action="load"><span data-i18n="load_btn"></span></div>
  <hr style="border:0;border-top:1px solid var(--glass-b);margin:5px 0">
  <div class="menu-item" onclick="localStorage.setItem('mgo_unified_version', document.documentElement.classList.contains('lite-mode') ? 'full' : 'lite');location.reload()" style="color:#94a3b8"><span id="__switch-lbl"></span></div>
  <div class="menu-item" data-action="reset-all" style="color:var(--err)"><span data-i18n="reset_all"></span></div>
</div>
<div id="pop-view" class="popover">
  <div id="pv-view-head">
    <div style="padding:0 4px 8px">
      <button class="mini-btn" data-action="open-users" style="width:100%; padding:8px; font-size:0.85rem; background:rgba(99,102,241,0.15); color:#fff; border-color:var(--p); font-weight:800;">
        ⚙️ Gérer les joueurs
      </button>
    </div>
    <hr style="border:0;border-top:1px solid var(--glass-b);margin:0">
    <div style="padding:8px 4px;font-size:0.8rem;opacity:0.6;text-transform:uppercase;font-weight:700" data-i18n="display"></div>
  </div>
  <div id="pv-edit-head" style="display:none">
    <div style="padding:0 0 8px; display:flex; justify-content:space-between; align-items:center; gap:8px">
      <button class="mini-btn danger" data-action="cancel-edit-users" style="padding:8px 12px; font-size:0.85rem; font-weight:800;">✕</button>
      <button class="mini-btn" data-action="add-user-row" style="flex:1; padding:8px; font-size:0.85rem; font-weight:800;">➕ Ajout</button>
      <button class="mini-btn" data-action="save-users" style="flex:1; padding:8px; font-size:0.85rem; background:var(--ok); color:#fff; border-color:var(--ok); font-weight:800;">✅ Enregistrer</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--glass-b);margin:0">
    <div style="padding:8px 4px;font-size:0.8rem;opacity:0.6;text-transform:uppercase;font-weight:700">Édition</div>
  </div>
  <div id="view-list" style="max-height:45vh;overflow-y:auto;padding-bottom:5px"></div>
  <div id="users-edit-list" style="display:none; flex-direction:column; gap:8px; max-height:45vh; overflow-y:auto; padding:4px 0"></div>
</div>
<div class="modal-overlay" id="mod-gold"><div class="modal-box"><div class="modal-head"><span style="font-weight:900;font-size:1.2rem;color:var(--gold)" data-i18n="gold_conf"></span><button class="mini-btn cb" data-action="close-gold">✕</button></div><div class="modal-body"><p style="text-align:center;opacity:0.7;font-size:0.9rem" data-i18n="click_gold"></p><div id="gold-grid-ctn"></div></div></div></div>
<div class="modal-overlay" id="mod-missions"><div class="modal-box" style="max-width:680px; max-height:55vh;"><div class="modal-head"><span style="font-weight:900;font-size:1.1rem;color:#a78bfa">📋 Missions de la semaine</span><button class="mini-btn cb" data-action="close-missions">✕</button></div><div class="missions-scroll" id="missions-body"></div></div></div>
<div class="app-container" id="main-app"><div id="gen-cards"></div><div class="glass-card gold-area anim-section" data-sec="Gold" id="sec-gold"><div class="card-header" style="border-bottom-color:rgba(251,191,36,.3)"><div class="user-info"><div class="user-avatar gold-ava"></div><div class="user-name" style="background:none; -webkit-text-fill-color:var(--gold); color:var(--gold);display:inline-block" data-i18n="gold_trades"></div></div><button class="mini-btn" data-action="add-gold-row" style="background:var(--gold);color:#000;border:none" data-i18n="add_upper"></button></div><div style="padding:15px"><div id="gold-list"></div></div></div></div>
<div class="modal-overlay" id="mod-import"><div class="modal-box" style="max-width:420px"><div class="modal-head"><span style="font-weight:900;font-size:1.2rem;color:var(--ok)" data-i18n="share_import_title"></span></div><div class="modal-body" style="display:flex;flex-direction:column;gap:16px"><p style="margin:0;color:var(--txt-dim);font-size:0.9rem" data-i18n="share_import_msg"></p><div id="import-preview" style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:16px"><div id="import-name" style="font-size:1.1rem;font-weight:900;color:var(--p);margin-bottom:4px"></div><div id="import-stats" style="font-size:0.82rem;color:var(--txt-dim)"></div></div><div id="import-step-1" style="display:flex;flex-direction:column;gap:8px"><button class="big-btn" id="btn-import-quick" style="display:none;padding:12px;font-size:0.88rem;margin:0;background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 8px 20px rgba(34,197,94,0.35)"></button><div style="display:flex;gap:8px"><button class="big-btn" id="btn-import-confirm" style="flex:1;padding:12px;font-size:0.88rem;margin:0">➕ Ajouter</button><button class="mini-btn" id="btn-import-replace" style="flex:1;padding:12px;font-size:0.88rem;justify-content:center;background:rgba(251,191,36,0.12);border-color:var(--gold);color:var(--gold)">🔄 Remplacer</button></div><button class="mini-btn" id="btn-import-cancel" style="width:100%;padding:10px;font-size:0.88rem;justify-content:center" data-i18n="share_import_cancel"></button></div><div id="import-step-2" style="display:none;flex-direction:column;gap:10px"><p style="margin:0;font-size:0.85rem;color:var(--txt-dim);text-align:center">Remplacer sur quel joueur ?</p><div id="import-player-select" style="display:flex;flex-direction:column;gap:6px"></div><div style="display:flex;gap:8px"><button class="mini-btn" id="btn-import-replace-back" style="flex:1;padding:10px;justify-content:center">← Retour</button><button class="mini-btn" id="btn-import-replace-confirm" style="flex:1;padding:10px;justify-content:center;background:var(--ok);color:#fff;border-color:var(--ok)" disabled>✅ Confirmer</button></div></div></div></div></div>
<script src="script.js"></script>
</body>
</html>
