<script>
window.Rnd=(s)=>function(){var t=s+=1831565813;return t=Math.imul(t^t>>>15,1|t),(((t^=t+Math.imul(t^t>>>7,61|t))^t>>>14)>>>0)/4294967296};
try{const v=localStorage.getItem('mgo_unified_version');if(v)document.documentElement.classList.add(v+'-mode');const c=JSON.parse(localStorage.getItem('mgo_cfg'));if(c&&c.seed&&Rnd(c.seed)()<0.01)document.documentElement.classList.add('is-shiney');}catch(e){}
