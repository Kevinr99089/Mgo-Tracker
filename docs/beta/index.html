<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta content="#02020e" name="theme-color"/>
<meta content="MGO Tracker" name="description"/>
<title></title>
<link href="favicon.ico" rel="icon" type="image/x-icon"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
html.is-shiney #splash{background:radial-gradient(circle at center,#4a2100 0%,#0c0300 100%)!important}
html.is-shiney .sp-c{box-shadow:0 0 28px rgba(251,191,36,.8)!important}
html{background:var(--bg);overscroll-behavior-y:none}
html.lite-mode{background-image:var(--lite-bg);background-attachment:fixed}
:root{
  --bg:#02020e;
  --glass:rgba(255,255,255,.03);
  --glass-b:rgba(255,255,255,.09);
  --txt:#e8eaf6;
  --txt-dim:#64748b;
  --p:#8b5cf6;
  --a:#f472b6;
  --gold:#f59e0b;
  --err:#f43f5e;
  --ok:#10b981;
  --r-l:22px;
  --r-s:9px;
  --font:'Outfit',system-ui,-apple-system,sans-serif;
  --font-mono:'DM Mono',monospace;
  --shd:0 10px 44px rgba(0,0,0,.6);
  --ease:cubic-bezier(.25,.8,.25,1);
  --lg-blur:blur(44px) saturate(190%) brightness(1.07);
  --lite-bg:radial-gradient(circle at 20% 25%,rgba(139,92,246,.22) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(244,114,182,.18) 0%,transparent 48%)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:0}
body{margin:0;padding:0 0 88px;background:transparent;color:var(--txt);min-height:100vh;font-family:var(--font);overflow-x:hidden;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
.ambient-bg{position:fixed;top:-10vh;left:-5vw;right:-5vw;bottom:-50vh;z-index:-1;overflow:visible;pointer-events:none;opacity:0;transition:opacity .75s;transform:translateZ(0);contain:layout style}
#splash{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.sp-deck{display:flex;align-items:flex-end;height:82px;position:relative}
.sp-c{width:50px;height:72px;border-radius:10px;opacity:0;animation:canim .55s var(--ease) forwards;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sp-c:first-child{transform:translateY(30px) rotate(-18deg);transform-origin:bottom center;animation-delay:.08s;--er:-18deg;margin-right:-18px;z-index:1}
.sp-c:nth-child(2){transform:translateY(30px);transform-origin:bottom center;animation-delay:.18s;--er:0deg;z-index:3;display:flex;align-items:center;justify-content:center;font-size:2rem;color:rgba(255,255,255,.9);margin-bottom:10px}
.sp-c:nth-child(3){transform:translateY(30px) rotate(18deg);transform-origin:bottom center;animation-delay:.28s;--er:18deg;margin-left:-18px;z-index:1}
@keyframes canim{to{opacity:1;transform:translateY(0) rotate(var(--er,0))}}
.sp-title{position:relative;z-index:10;font-size:2rem;font-weight:900;letter-spacing:-.5px;color:var(--txt);animation:fup .5s var(--ease) .45s both}
.sp-title em{font-style:normal;color:var(--p)}
.sp-title span{color:var(--gold)}
html.is-shiney .sp-title span{font-size:.6em;vertical-align:middle}
.sp-hint{position:relative;z-index:10;font-size:.78rem;color:var(--txt-dim);animation:fup .5s var(--ease) .65s both;font-weight:500}
@keyframes fup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.app-container{max-width:1400px;margin:0 auto;padding:10px}
.glass-card{
  background:rgba(8,10,26,.42);
  border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-l);
  box-shadow:0 4px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;position:relative;
  transition:opacity .3s,transform .4s var(--ease),box-shadow .4s var(--ease),max-height .4s var(--ease),margin-bottom .4s var(--ease);
  max-height:3000px;opacity:1;margin-bottom:12px;transform-origin:center top;
  touch-action:manipulation;contain:layout style;width:100%
}
.glass-card.hidden{opacity:0;max-height:0;margin-bottom:0;transform:scale(.95) translateY(-20px);pointer-events:none}
.glass-card.blur-active{backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%)}
.glass-card::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s var(--ease)}
.glass-card.blur-active:not(.blur-out)::before{opacity:1}
.glass-card.blur-out{backdrop-filter:none;-webkit-backdrop-filter:none}
.glass-card.expanded{
  border:1.5px solid rgba(139,92,246,.55);
  transform:none;z-index:10;
  box-shadow:0 32px 64px rgba(0,0,0,.65),0 0 0 1px rgba(139,92,246,.12),inset 0 1px 0 rgba(255,255,255,.07);
  width:100%;margin-left:0;contain:none
}
@media(max-width:768px){.glass-card.expanded{width:100vw;margin-left:calc(-50vw + 50%)}}
.glass-card.transitioning *{transition:none!important}
.card-header{
  padding:10px 14px;min-height:50px;
  background:linear-gradient(to bottom,rgba(255,255,255,.045),transparent);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.06);
  cursor:pointer;touch-action:manipulation;position:relative
}
.user-info{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.user-avatar{
  height:26px;border-radius:8px;padding:1.5px;flex:1;min-width:0;
  background:var(--p);
  box-shadow:0 3px 12px rgba(0,0,0,.35);transition:background .5s;display:flex
}
.ua-inner{
  width:100%;height:100%;
  background:linear-gradient(135deg,#1a1448 0%,#2b0e66 40%,#4a0e50 70%,#180e3e 100%);
  border-radius:7px;display:flex;flex-direction:row;align-items:center;
  padding:0 10px;gap:9px;overflow:hidden
}
.ua-name{
  font-size:.88rem;line-height:1;font-weight:800;
  background:linear-gradient(to right,#c4b5fd,#f472b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;filter:drop-shadow(0 0 3px rgba(0,0,0,.8))
}
.ua-vsep{width:1px;height:15px;background:rgba(255,255,255,.15);flex-shrink:0}
.ua-top{font-size:.7rem;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap;flex-shrink:0;font-family:var(--font-mono)}
.ua-bot{font-size:.7rem;color:var(--gold);font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap;flex-shrink:0;font-family:var(--font-mono)}
.ua-percent{font-size:.75rem;font-weight:800;white-space:nowrap;flex-shrink:0;text-shadow:0 1px 3px rgba(0,0,0,.8);font-family:var(--font-mono)}
.user-name{display:none}
.grid-scroll{padding:10px;display:flex;flex-direction:column;gap:2px;transition:padding .4s var(--ease)}
.glass-card.expanded .grid-scroll{overflow-x:auto;padding:20px;display:block}
.track-row{display:flex;width:100%;justify-content:flex-start;transition:all .4s var(--ease)}
.alb-col{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;border-right:1px solid rgba(255,255,255,.07);padding:0 1px;transition:padding .4s,border .4s}
.glass-card.expanded .alb-col{flex:none!important;width:auto!important;padding:0 16px;border-right:1px solid rgba(255,255,255,.2)}
.alb-head{font-size:10px;font-weight:800;color:rgba(148,163,184,.6);text-transform:uppercase;letter-spacing:.2px;margin-bottom:2px;width:100%;text-align:center;transition:font-size .4s,margin .4s;font-family:var(--font-mono)}
.glass-card.expanded .alb-head{font-size:.75rem;margin:8px 0}
.alb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;width:100%;transition:gap .4s,width .4s}
.glass-card.expanded .alb-grid{grid-template-columns:repeat(3,36px);gap:4px;width:auto;margin-bottom:8px}
.cell-wrap{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:3px;cursor:pointer;
  background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.065);
  transition:width .4s var(--ease),height .4s,border-radius .4s,background .15s,transform .12s,border-color .15s,box-shadow .15s;
  z-index:1;touch-action:manipulation
}
.glass-card.expanded .cell-wrap{width:36px;height:36px;border-radius:var(--r-s);border:1px solid rgba(255,255,255,.1)}
.cell-wrap:hover{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.45);transform:scale(1.1);z-index:2;box-shadow:0 2px 10px rgba(139,92,246,.22)}
.cell-wrap:active{transform:scale(.88)!important;transition:transform .07s!important;background:rgba(139,92,246,.32)!important}
.cell-wrap[data-st="1"]{background:rgba(139,92,246,.62);border-color:rgba(139,92,246,.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.cell-wrap[data-st="2"]{background:rgba(244,63,94,.55);border-color:rgba(244,63,94,.88)}
.cell-wrap[data-bg="1"]::after{
  content:'';position:absolute;inset:-2px;border:2px solid var(--gold);
  pointer-events:none;z-index:4;border-radius:5px;transition:inset .4s;
  box-shadow:0 0 6px rgba(245,158,11,.5)
}
.glass-card.expanded .cell-wrap[data-bg="1"]::after{inset:-3px;border:2px solid var(--gold);border-radius:calc(var(--r-s) + 3px);box-shadow:0 0 12px rgba(245,158,11,.8),0 0 28px rgba(245,158,11,.3)}
.cell-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px;color:rgba(255,255,255,.75);opacity:0;transition:.2s;font-family:var(--font-mono)}
.glass-card.expanded .cell-inner{font-size:14px;transform:scale(.5);color:#fff}
.cell-wrap[data-st="1"] .cell-inner,.cell-wrap[data-st="2"] .cell-inner,.glass-card.is-primary.mode-num .cell-inner{opacity:1;transform:scale(1)}
.i-dot{position:absolute;border-radius:50%;display:none;z-index:10;width:5px;height:5px;top:1px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.i-gold{background:var(--gold);right:1px;box-shadow:0 0 4px rgba(245,158,11,.7),0 1px 2px rgba(0,0,0,.5)}
.i-dupe{background:var(--err);left:1px}
.glass-card.expanded .i-dot{width:7px;height:7px;top:3px}
.glass-card.expanded .i-gold{right:4px}
.glass-card.expanded .i-dupe{left:4px}
.cell-wrap.show-dupe .i-dupe,.cell-wrap.show-gold .i-gold{display:block}
.glass-card.expanded .i-gold{display:none!important}
.t-num{display:none}
.glass-card.is-primary.mode-num .t-num{display:inline}
.glass-card.is-primary.mode-num .t-x{display:none}
.cell-input{width:100%;height:100%;background:rgba(0,0,0,.5);border:1px solid var(--p);color:#fff;text-align:center;font-size:10px;font-weight:700;border-radius:2px;padding:0;font-family:var(--font-mono)}
.mini-btn{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);padding:5px 10px;border-radius:9px;
  font-size:.72rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:.18s;font-family:var(--font);letter-spacing:.2px
}
.mini-btn:hover:not(:disabled){background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 12px rgba(139,92,246,.3)}
.mini-btn:disabled{opacity:.4;cursor:not-allowed}
.mini-btn.danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:var(--err);font-weight:900}
.mini-btn.danger:active:not(:disabled),.mini-btn.danger:hover:not(:disabled){background:var(--err);border-color:var(--err);color:#fff;transform:scale(1.12);box-shadow:0 0 12px rgba(244,63,94,.5)}
.cb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:5px 10px;color:rgba(255,255,255,.7);font-size:.85rem;font-weight:900;line-height:1}
.sb-btn{width:100%;justify-content:flex-start;padding:12px 16px;font-size:.93rem}
.pm-input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:9px;color:#fff;outline:none;transition:border-color .2s,background .2s;font-family:var(--font);text-align:center;font-size:.88rem}
.pm-input:focus{border-color:rgba(139,92,246,.6);background:rgba(0,0,0,.45)}
.pm-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 9px;transition:all .2s;cursor:default}
.pm-handle{font-size:1.2rem;color:var(--txt-dim);cursor:grab;padding:0 4px;line-height:1;user-select:none;touch-action:none}
.pm-handle:hover{color:var(--p)}
.pm-handle:active{cursor:grabbing}
.pm-row.pm-dragging{opacity:.35;border-color:var(--p);transform:scale(.98)}
.pm-row.pm-drag-over{border-color:var(--p);background:rgba(139,92,246,.1);transform:translateY(-2px);box-shadow:0 6px 20px rgba(139,92,246,.2)}
@keyframes pm-new-flash{0%{border-color:var(--err);box-shadow:0 0 10px rgba(244,63,94,.5)}50%{border-color:transparent;box-shadow:none}100%{border-color:var(--err);box-shadow:0 0 10px rgba(244,63,94,.5)}}
.pm-row.pm-new{border-color:#f97316!important;box-shadow:0 0 8px rgba(249,115,22,.3)}
.pm-row.pm-flashing{animation:pm-new-flash .45s ease-in-out 2;border-color:var(--err)!important}
.pm-touch-clone{position:fixed;z-index:99999;pointer-events:none;background:rgba(139,92,246,.2)!important;border:1px solid var(--p)!important;border-radius:10px;padding:7px 9px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(0,0,0,.6);opacity:.9;box-sizing:border-box}
.dock-wrap{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:1000;pointer-events:none;transform:translateY(calc(100% + 30px))}
.dock{
  pointer-events:auto;
  background:rgba(6,6,18,.82);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  border:1px solid rgba(255,255,255,.11);padding:6px 8px;border-radius:999px;
  display:flex;align-items:center;gap:0;
  box-shadow:0 20px 52px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.09);
  transition:border-color .3s,box-shadow .3s,background .3s
}
.dock.dock-lit{border-color:rgba(139,92,246,.45);box-shadow:0 20px 52px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.09),0 0 24px rgba(139,92,246,.18)}
.dock-btn{height:46px;border-radius:999px;border:none;background:0 0;color:rgba(255,255,255,.72);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 11px;min-width:48px;transition:background .18s,color .18s,transform .15s;position:relative;overflow:hidden}
.dock-btn svg{width:20px;height:20px;fill:currentColor;transition:filter .2s,transform .15s}
.dock-label{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;white-space:nowrap;transition:color .2s;font-family:var(--font)}
.dock-btn:active{transform:scale(.82)!important;transition:transform .06s!important}
.dock-btn.active:active{transform:none!important;transition:none!important}
.dock-btn.active{background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(244,114,182,.12));color:var(--p)!important;box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.dock-btn.active svg{filter:drop-shadow(0 0 6px var(--p));transform:scale(1.08)}
.dock-btn.active .dock-label{color:var(--p)}
.popover{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%) scale(.9);
  width:288px;min-width:288px;
  background:rgba(8,8,22,.78);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  border:1px solid rgba(139,92,246,.38);border-radius:24px;padding:10px;
  opacity:0;pointer-events:none;
  box-shadow:0 20px 52px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.09);
  transition:opacity .2s,transform .2s,width .3s var(--ease);overflow:hidden;z-index:9600
}
.popover.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;color:var(--txt);font-size:.9rem;cursor:pointer;user-select:none;font-weight:500}
.menu-item:hover{background:rgba(255,255,255,.05)}
.menu-item.no-hover:hover{background:transparent}
.switch{position:relative;width:40px;height:22px;background:#2d3748;border-radius:20px;transition:.3s;pointer-events:none}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
input:checked+.switch{background:var(--p)}
input:checked+.switch::after{transform:translateX(18px)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9700;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;backdrop-filter:blur(4px)}
.modal-overlay.open{opacity:1;visibility:visible}
.modal-box{
  width:95%;max-width:800px;max-height:90vh;
  background:rgba(8,8,24,.82);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  border:1px solid rgba(139,92,246,.32);border-radius:24px;display:flex;flex-direction:column;
  box-shadow:0 28px 60px rgba(0,0,0,.72),inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.25);
  transform:scale(.88) translateY(20px);opacity:0;
  transition:transform .42s cubic-bezier(.34,1.42,.64,1),opacity .28s ease-out
}
.modal-overlay.open .modal-box{transform:scale(1) translateY(0);opacity:1}
.modal-overlay:not(.open) .modal-box{transform:scale(.92) translateY(10px);opacity:0;transition:transform .2s ease-in,opacity .18s ease-in}
.modal-head{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;position:relative}
.modal-head>span[data-i18n],.modal-head>#dialog-title{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;font-weight:800;font-size:.95rem}
.modal-head>.mini-btn{margin-left:auto}
.modal-body{padding:20px;overflow-y:auto}
.gold-row{display:grid;grid-template-columns:52px 1fr 68px auto;gap:8px;background:rgba(0,0,0,.22);padding:9px;border-radius:9px;margin-bottom:8px;border:2px dashed rgba(245,158,11,.22)}
.g-inp{background:0 0;border:none;color:var(--gold);border-bottom:1px solid rgba(245,158,11,.22);font-family:var(--font-mono);text-align:center;width:100%;font-size:.88rem}
.gold-row-header{display:grid;grid-template-columns:52px 1fr 68px auto;gap:8px;padding:0 8px 4px;text-align:center;font-size:.7rem;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px}
.g-conf-row{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:10px}
.g-conf-col{flex:none;border:1px solid rgba(255,255,255,.08);padding:5px;border-radius:8px;display:flex;flex-direction:column;align-items:center}
.g-conf-grid{display:grid;grid-template-columns:repeat(3,25px);gap:2px}
.g-cell{width:25px;height:25px;background:rgba(255,255,255,.08);border:1px solid transparent;cursor:pointer;border-radius:2px;transition:.15s}
.g-cell:hover{background:rgba(245,158,11,.25);border-color:rgba(245,158,11,.4)}
.g-cell.active{background:var(--gold);border-color:#fff;box-shadow:0 0 6px rgba(245,158,11,.5)}
#toast{
  position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-64px) scale(.88);
  background:rgba(7,8,22,.9);backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(255,255,255,.1);color:#fff;padding:12px 24px;border-radius:28px;
  font-weight:700;font-size:.88rem;
  box-shadow:0 20px 52px rgba(0,0,0,.65),0 0 0 1px rgba(139,92,246,.07),inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.22);
  opacity:0;visibility:hidden;transition:transform .2s ease-in,opacity .2s ease-in,visibility .2s;
  z-index:9999;text-align:center;max-width:min(90vw,400px);line-height:1.4;word-wrap:break-word;font-family:var(--font)
}
#toast.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;visibility:visible;transition:transform .44s cubic-bezier(.34,1.56,.64,1),opacity .28s ease-out,visibility 0s}
#setup-mod{position:fixed;inset:0;z-index:9100;background:linear-gradient(135deg,rgba(2,3,14,.98),rgba(7,4,22,.99));display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s;padding:20px}
#setup-mod.open{opacity:1;visibility:visible}
.setup-card{width:100%;max-width:520px;border-radius:28px;padding:0;display:flex;flex-direction:column;max-height:90vh;overflow-y:auto;background:rgba(7,8,24,.95);border:1px solid rgba(139,92,246,.2);box-shadow:0 0 0 1px rgba(139,92,246,.05),0 24px 64px rgba(0,0,0,.9);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px)}
.setup-header{padding:28px 28px 22px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg,rgba(139,92,246,.06) 0%,transparent 100%)}
.setup-deck{display:flex;align-items:flex-end;justify-content:center;height:52px;margin-bottom:14px}
.setup-dc{width:34px;height:48px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.setup-dc1{transform:rotate(-18deg) translateY(8px);transform-origin:bottom center;margin-right:-12px;z-index:1}
.setup-dc2{z-index:3;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:4px}
.setup-dc3{transform:rotate(18deg) translateY(8px);transform-origin:bottom center;margin-left:-12px;z-index:1}
.setup-title{font-size:1.9rem;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#c4b5fd 0%,#f472b6 50%,#a5b4fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.setup-tagline{font-size:.82rem;color:var(--txt-dim);margin:0;font-weight:500}
.setup-steps{padding:4px 0;list-style:none;margin:0}
.setup-step{display:flex;align-items:flex-start;gap:16px;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .2s}
.setup-step:hover{background:rgba(255,255,255,.015)}
.setup-step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:900;flex-shrink:0;background:rgba(139,92,246,.14);border:1.5px solid rgba(139,92,246,.38);color:var(--p);box-shadow:0 0 12px rgba(139,92,246,.12);margin-top:2px}
.setup-step-num.gold-num{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4);color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,.12)}
.setup-step-body{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.setup-step-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-dim)}
.setup-alb-row{display:flex;align-items:center;gap:12px}
.setup-footer{padding:16px 24px 24px}
.setup-launch{width:100%;background:linear-gradient(135deg,#4d4dc4,#7c3aed,#be185d);background-size:200% 200%;animation:launch-grad 3s ease infinite;color:#fff;border:none;padding:17px;border-radius:15px;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 12px 32px rgba(139,92,246,.28),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s,box-shadow .2s;font-family:var(--font);letter-spacing:.3px}
.setup-launch:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 18px 40px rgba(139,92,246,.4),inset 0 1px 0 rgba(255,255,255,.18)}
@keyframes launch-grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.big-btn{background:var(--p);color:#fff;border:none;padding:15px;border-radius:13px;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 10px 22px rgba(139,92,246,.28);margin-top:10px;transition:.2s;font-family:var(--font);width:100%}
.big-btn:hover{transform:scale(1.02);box-shadow:0 16px 32px rgba(139,92,246,.38)}
.lite-mode body{background:transparent!important}
.lite-mode #ambient-bg{background-color:var(--bg)!important;background-image:var(--lite-bg)!important;background-attachment:fixed!important;opacity:1!important}
.lite-mode .glass-card{background:rgba(6,9,22,.94)!important;backdrop-filter:none!important;transition:none!important;transform:none!important;max-height:none!important}
.lite-mode .glass-card.hidden{display:none!important}
.lite-mode #app-header{background:rgba(6,9,22,.97)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.lite-mode .dock,.lite-mode #toast,.lite-mode .modal-box,.lite-mode .setup-card{backdrop-filter:none!important;background:rgba(12,16,38,.96)!important}
.lite-mode .popover{backdrop-filter:none!important;background:rgba(12,16,38,.96)!important;transition:opacity .2s,transform .2s!important}
.lite-mode .glass-card::before{display:none!important}
.lite-mode .sp-c,.lite-mode .sp-title,.lite-mode .sp-hint{animation:none!important;opacity:1;transform:translateY(0) rotate(var(--er,0deg))!important}
[data-full-only]{display:none}
.full-mode [data-full-only]{display:revert}
#__hub{position:fixed;inset:0;z-index:9999;background:var(--bg);background-image:radial-gradient(circle at 20% 25%,rgba(139,92,246,.22) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(244,114,182,.2) 0%,transparent 48%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#__hub-card{background:rgba(8,10,24,.78);border:1px solid rgba(139,92,246,.4);border-radius:28px;padding:36px 28px;max-width:410px;width:100%;text-align:center;box-shadow:0 10px 48px rgba(0,0,0,.65),inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.25);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur)}
#__hub-card h2{font-size:1.5rem;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}
#__hub-card p{color:var(--txt-dim);font-size:.88rem;margin-bottom:26px;line-height:1.5;font-weight:500}
.hub-deck{display:flex;align-items:flex-end;justify-content:center;height:68px;margin-bottom:20px}
.hub-dc{width:44px;height:62px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:hub-bob var(--d,4s) ease-in-out infinite alternate}
@keyframes hub-bob{0%{transform:translateY(0)}100%{transform:translateY(-7px)}}
.hub-dc1{transform:rotate(-18deg) translateY(12px);margin-right:-14px;z-index:1;--d:4.8s}
.hub-dc2{z-index:3;--d:4s;font-size:1.8rem;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);margin-bottom:5px}
.hub-dc1,.hub-dc3{transform-origin:bottom}
.hub-dc3{transform:rotate(18deg) translateY(12px);margin-left:-14px;z-index:1;--d:5.3s}
.hub-btn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 18px;border:none;border-radius:16px;font-size:.95rem;font-weight:800;cursor:pointer;transition:transform .2s,filter .2s;margin-bottom:10px;text-align:left;position:relative;overflow:hidden;font-family:var(--font)}
.hub-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.1) 0%,transparent 60%);border-radius:inherit;pointer-events:none}
.hub-btn:hover{transform:scale(1.025);filter:brightness(1.1)}
.hub-btn-full{background:linear-gradient(135deg,#4d4dc4,#8b5cf6);color:#fff;box-shadow:0 8px 28px rgba(139,92,246,.32)}
.hub-btn-lite{background:rgba(244,114,182,.1);border:2px solid rgba(244,114,182,.65);color:#f9a8d4}
.hub-btn-icon{font-size:1.4rem;flex-shrink:0}
.hub-btn-texts{display:flex;flex-direction:column;flex:1}
.hub-btn-lbl{font-size:.95rem;font-weight:800}
.hub-btn-desc{font-size:.7rem;font-weight:500;opacity:.7;margin-top:2px}
.hub-btn-arr{opacity:.45;font-size:.9rem}
@keyframes hub-card-in{0%{opacity:0;transform:translateY(28px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes hub-glow-pulse{0%,100%{box-shadow:0 10px 48px rgba(0,0,0,.65),inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.25),0 0 0px rgba(139,92,246,0)}50%{box-shadow:0 10px 48px rgba(0,0,0,.65),inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.25),0 0 40px rgba(139,92,246,.2)}}
@keyframes hub-btn-in{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:translateX(0)}}
#__hub-card{animation:hub-card-in .55s cubic-bezier(.22,1,.36,1) forwards,hub-glow-pulse 4s ease-in-out .6s infinite}
#__hub-card h2{background:linear-gradient(90deg,#8b5cf6,#f472b6,#a78bfa,#8b5cf6);background-size:250% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:launch-grad 4s linear infinite}
.hub-btn{opacity:0;animation:hub-btn-in .45s cubic-bezier(.22,1,.36,1) forwards}
.hub-btn-full{animation-delay:.35s}
.hub-btn-lite{animation-delay:.48s}
#app-header{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:54px;background:rgba(8,10,26,.68);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.09);border-radius:15px;margin-bottom:12px;position:sticky;top:10px;z-index:200;box-shadow:0 4px 24px rgba(0,0,0,.45)}
.app-hdr-left{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.app-hdr-deck{display:flex;align-items:center;height:28px;flex-shrink:0;opacity:0;transition:opacity .25s ease}
.app-hdr-deck.visible{opacity:1}
.ahd-c{width:16px;height:23px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ahd-c1{transform:rotate(-18deg) translateY(3px);transform-origin:bottom center;margin-right:-5px;z-index:1}
.ahd-c2{z-index:3;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:rgba(255,255,255,.9)}
.ahd-c3{transform:rotate(18deg) translateY(3px);transform-origin:bottom center;margin-left:-5px;z-index:1}
.app-hdr-brand-info{display:flex;align-items:center;gap:6px;flex-shrink:0}
.app-hdr-title{font-size:.88rem;font-weight:900;letter-spacing:-.4px;background:linear-gradient(135deg,#c4b5fd 0%,#f472b6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.app-hdr-title em{font-style:normal}
.app-hdr-note{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.1);color:var(--txt-dim);font-size:.68rem;padding:2px 0;flex:1;min-width:40px;font-family:var(--font);outline:none;transition:color .2s,border-color .2s}
.app-hdr-note:focus{color:var(--txt);border-bottom-color:var(--p)}
.app-hdr-note::placeholder{color:rgba(100,116,139,.4)}
.app-hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-stat{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--txt-dim)}
.hdr-stat-val{color:var(--txt);font-weight:800;font-family:var(--font-mono)}
.expand-hint{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:.58rem;color:rgba(255,255,255,.15);letter-spacing:.5px;user-select:none;pointer-events:none}
.glass-card.expanded .expand-hint{display:none}
.legend-bar{display:flex;gap:10px;padding:5px 10px 7px;justify-content:flex-end;align-items:center;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--txt-dim);font-weight:600;white-space:nowrap}
.legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend-swatch.s-have{background:rgba(139,92,246,.75);border:1px solid var(--p)}
.legend-swatch.s-dupe{background:rgba(244,63,94,.7);border:1px solid var(--err)}
.legend-swatch.s-gold-dot{background:transparent;border:2px solid var(--gold);box-shadow:0 0 5px rgba(245,158,11,.4)}
.reset-u-btn{opacity:.5;transition:opacity .2s,background .2s!important}
.reset-u-btn:hover,.reset-u-btn:active{opacity:1}
.gold-ava{background:linear-gradient(135deg,#1c1940,#0f1520)!important;border:2px solid var(--gold)!important;box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 10px rgba(245,158,11,.18)!important}
.ua-gold-label{font-size:.75rem;font-weight:800;color:var(--gold);white-space:nowrap;flex-shrink:0;text-shadow:0 1px 3px #000}
#sec-gold .card-header{border-bottom-color:rgba(245,158,11,.25)}
#sec-gold .mini-btn[data-action="add-gold-row"]{background:var(--gold);color:#000;border:none;font-weight:800}
#sec-gold .user-name{-webkit-text-fill-color:var(--gold)!important;color:var(--gold)!important}
.sp-c:first-child,.setup-dc1,.hub-dc1,.ahd-c1{background:linear-gradient(145deg,#3a40d5,#6268f4)}
.sp-c:nth-child(2),.setup-dc2,.hub-dc2,.ahd-c2{background:linear-gradient(145deg,#c47b10,#efaa1f)}
.sp-c:nth-child(3),.setup-dc3,.hub-dc3,.ahd-c3{background:linear-gradient(145deg,#b71e38,#e93a5d)}
menu.popover{list-style:none;margin:0;padding:10px}
button.menu-item{background:none;border:none;width:100%;font-family:var(--font);text-align:left}
output#toast{display:block}
.pl-share-btn{padding:4px 8px;margin-right:10px;font-size:.8rem;background:rgba(139,92,246,.12);border-color:var(--p);color:#fff}
.print-item{padding:5px 8px;font-size:.8rem}
.switch-sm{transform:scale(.7);transform-origin:right center}
.print-launch-btn{justify-content:center;background:var(--p);color:#fff;margin-top:5px;width:100%}
.mode-toggle-btn{height:20px;font-size:.6rem;padding:1px 5px;flex-shrink:0}
.g-del-btn{background:none;border:none;color:var(--err);font-weight:700;cursor:pointer;transition:transform .15s}
.g-del-btn:hover{transform:scale(1.2)}
.hr-sep{border:0;border-top:1px solid rgba(255,255,255,.07);margin:5px 0}
.hr-sep-flush{border:0;border-top:1px solid rgba(255,255,255,.07);margin:0}
.pv-head-actions{padding:0 4px 8px}
.btn-manage-players{width:100%;padding:9px;font-size:.85rem;background:rgba(139,92,246,.14);color:#fff;border-color:var(--p);font-weight:800}
.popover-sublabel{padding:8px 4px;font-size:.8rem;opacity:.55;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
#players-edit-head .popover-sublabel{padding:3px 4px;font-size:.7rem}
.edit-head-actions{padding:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pm-save-footer{display:none;justify-content:flex-end;padding-top:6px}
.btn-save-players{padding:5px 10px;font-size:.75rem;background:var(--ok);color:#fff;border-color:var(--ok);font-weight:800}
#mod-gold .modal-head span{font-weight:900;font-size:1.2rem;color:var(--gold)}
#mod-gold .modal-body p{text-align:center;opacity:.65;font-size:.9rem}
#mod-gold .modal-box,#mod-missions .modal-box{max-width:760px;max-height:68vh}
#mod-missions .modal-head span{font-weight:900;font-size:1.1rem;color:#c4b5fd}
.gold-content{padding:15px}
#mod-import .modal-box{max-width:420px}
#mod-import .modal-head span{font-weight:900;font-size:1.2rem;color:var(--ok)}
#mod-import .modal-body{display:flex;flex-direction:column;gap:16px}
#mod-import .modal-body>p{margin:0;color:var(--txt-dim);font-size:.9rem}
#import-step-2>p{margin:0;font-size:.85rem;color:var(--txt-dim);text-align:center}
.import-btn-row{display:flex;gap:8px}
.import-confirm-row{display:flex;flex-direction:column;gap:6px}
#setup-gold-grid{overflow-y:auto;padding:5px;flex:1;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(0,0,0,.2)}
.alb-pill{width:24px;height:22px;border-radius:5px;border:1.5px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:var(--txt-dim);font-size:.68rem;font-weight:700;cursor:pointer;transition:.15s;padding:0;font-family:var(--font-mono)}
.alb-pill.active{background:rgba(139,92,246,.2);border-color:var(--p);color:var(--txt);box-shadow:0 0 6px rgba(139,92,246,.25)}
.alb-pill:hover:not(.active){background:rgba(255,255,255,.07);color:var(--txt)}
#initAmbiance-sel{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.initAmbiance-pill{width:28px;height:24px;border-radius:5px;border:1.5px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);cursor:pointer;transition:.15s;padding:0;display:flex;align-items:center;justify-content:center}
.initAmbiance-pill.active{background:rgba(255,255,255,.1)}
.initAmbiance-pill:hover:not(.active){background:rgba(255,255,255,.07)}
.initAmbiance-main-btn{cursor:pointer;color:var(--txt);font-family:var(--font);line-height:1.2;font-size:.9rem;font-weight:500;padding:4px 0}
.initAmbiance-main-btn:hover .initAmbiance-sub{opacity:.8}
.initAmbiance-sub{font-size:.65rem;font-weight:700;transition:color .2s}
.initAmbiance-sub.is-anim{color:var(--p)}
.initAmbiance-sub.is-static{color:var(--txt-dim)}
#sub-print{display:none;flex-direction:column;gap:2px;background:rgba(0,0,0,.2);padding:8px;border-radius:8px;margin-bottom:8px}
#btn-version-switch{color:var(--txt-dim)}
#players-edit-head{display:none}
#players-list{max-height:45vh;overflow-y:auto;padding-bottom:5px}
#pop-players{display:flex;flex-direction:column;max-height:calc(100dvh - 110px);overflow:hidden}
#players-edit-list{display:none;flex-direction:column;gap:8px;max-height:45vh;overflow-y:auto;flex:1;padding:4px 0}
#import-preview{background:rgba(139,92,246,.07);border:1px solid rgba(139,92,246,.25);border-radius:13px;padding:16px}
#import-name{font-size:1.1rem;font-weight:900;color:var(--p);margin-bottom:4px}
#import-stats{font-size:.82rem;color:var(--txt-dim);font-family:var(--font-mono)}
#import-step-1{display:flex;flex-direction:column;gap:8px}
#btn-import-quick{display:none;padding:12px;font-size:.88rem;margin:0;background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 8px 22px rgba(16,185,129,.32)}
#btn-import-confirm{flex:1;padding:12px;font-size:.88rem;margin:0}
#btn-import-replace{flex:1;padding:12px;font-size:.88rem;justify-content:center;background:rgba(245,158,11,.1);border-color:var(--gold);color:var(--gold)}
#btn-import-cancel{width:100%;padding:10px;font-size:.88rem;justify-content:center}
#import-step-2{display:none;flex-direction:column;gap:10px}
#btn-import-replace-back{flex:1;padding:10px;justify-content:center}
#btn-import-replace-confirm{flex:1;padding:10px;justify-content:center;background:var(--ok);color:#fff;border-color:var(--ok)}
.print-arrow{font-size:.8rem;opacity:.55}
.dialog-btn{flex:1;padding:9px 10px;border-radius:11px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;transition:.18s;font-family:var(--font);text-align:center;white-space:nowrap}
.dialog-btn:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.dialog-btn:active{transform:scale(.95)}
.dialog-btn.primary{background:var(--p);border-color:var(--p);box-shadow:0 4px 12px rgba(139,92,246,.25)}
.dialog-btn.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.dialog-btn.danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:#f87171}
.dialog-btn.danger:hover{background:var(--err);color:#fff;border-color:var(--err)}
.dialog-checkUrl-row{display:flex;align-items:center;gap:8px;padding:8px 0 4px;cursor:pointer;user-select:none;font-size:.82rem;color:var(--txt-dim)}
.dialog-checkUrl-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--p);cursor:pointer;flex-shrink:0}
#mod-dialog .modal-box{max-width:340px}
#mod-dialog .modal-body{padding:10px 16px 8px}
#dialog-msg{white-space:pre-line;margin:0;line-height:1.55;font-size:.85rem;color:var(--txt-dim)}
#dialog-checkUrl-wrap{padding:0 16px;display:none}
#dialog-btns{padding:8px 16px 16px;display:flex;flex-direction:row;gap:8px;flex-wrap:wrap}
.initAmbiance-pill svg{display:block;flex-shrink:0}
.initAmbiance-pill[data-v="0"]{border-color:rgba(99,102,241,.35)}
.initAmbiance-pill[data-v="1"]{border-color:rgba(199,123,16,.35)}
.initAmbiance-pill[data-v="2"]{border-color:rgba(56,189,248,.35)}
.initAmbiance-pill[data-v="3"]{border-color:rgba(168,85,247,.35)}
.initAmbiance-pill[data-v="4"]{border-color:rgba(245,158,11,.35)}
.initAmbiance-pill[data-v="0"].active{border-color:#8b5cf6;box-shadow:0 0 8px rgba(139,92,246,.45)}
.initAmbiance-pill[data-v="1"].active{border-color:#c77b10;box-shadow:0 0 8px rgba(199,123,16,.45)}
.initAmbiance-pill[data-v="2"].active{border-color:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,.45)}
.initAmbiance-pill[data-v="3"].active{border-color:#a855f7;box-shadow:0 0 8px rgba(168,85,247,.45)}
.initAmbiance-pill[data-v="4"].active{border-color:var(--gold);box-shadow:0 0 8px rgba(245,158,11,.45)}
.dock-btn[data-action="open-gold-mod"]{color:var(--gold)}

<script>
const VER_KEY = 'mgo_unified_version';
let LITE_MODE = document.documentElement.classList.contains('lite-mode'),
  initLocked = false;
const D = document,
  E = (i) => D.getElementById(i),
  Q = (s) => D.querySelectorAll(s),
  C = (t) => D.createElement(t),
  LS = localStorage;
let undoStack  = [],

  pixiErr    = false,
  noteTimer  = null,
  dockTimer  = null;
const EMOJIS = D.getElementById('emoji-bank').dataset;
const APP_VER = '4.4.0 (Web)';
const SHARE_URL   = 'https://kevinr99089.github.io/Mgo-Tracker/?share=';

const ALBUM_MAX   = 26;
const STORAGE = {
  CFG:       'mgo_cfg',
  USER:      'mgo_u_',
  MISS_DATA: 'mgo_missions_data_',
  MISS_OLD:  'mgo_missions_data',
  MISS_WEEK: 'mgo_missions_week',
  NOTE:      'mgo_gold_note',
  SHARE:     'mgo_share_mem',
};
let i18n = {};
const T = (k) => i18n[k] || k,
  esc = (s) =>
    (s + '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
function tr() {
  Q('[data-i18n]').forEach((e) => {
    const k = e.dataset.i18n;
    k === 'add_btn' ? (e.innerHTML = T(k)) : (e.textContent = T(k));
  });
  Q('[data-i18n-html]').forEach((e) => {
    e.innerHTML = T(e.dataset.i18nHtml) || '';
  });
  Q('[data-i18n-aria]').forEach((e) => {
    e.setAttribute('aria-label', T(e.dataset.i18nAria));
  });
  Q('[data-i18n-ph]').forEach((e) => {
    e.setAttribute('data-placeholder', T(e.dataset.i18nPh));
  });
  document.title = T('pg_ttl');
}
function __playShineySplash(isFast = false) {
  document.documentElement.classList.add('is-shiney');
  const spt = Q('.sp-title')[0],
    sph = Q('.sp-hint')[0];
  setTimeout(
    () => {
      [spt, sph].forEach((el) => {
        if (!el) return;
        const cur = getComputedStyle(el).opacity;
        el.style.animation = 'none';
        el.style.opacity = cur;
        void el.offsetHeight;
      });
      if (spt) {
        spt.style.transition = 'opacity 0.3s ease';
        spt.style.opacity = '0';
      }
      if (sph) {
        sph.style.transition = 'opacity 0.25s ease';
        sph.style.opacity = '0';
      }
      setTimeout(() => {
        if (spt) {
          spt.innerHTML = T('shy_ttl');
          spt.style.opacity = '1';
        }
        if (sph) {
          sph.textContent = T('shy_hint');
          sph.style.opacity = '1';
        }
      }, 150);
    },
    isFast ? 150 : 1050
  );
}
function __flyDeckToHeader(sp) {
  const spDeck = sp && sp.querySelector('.sp-deck'),
    hdrDeck = E('app-hdr-deck');
  if (!spDeck || !hdrDeck) return;
  const spR = spDeck.getBoundingClientRect(),
    hR = hdrDeck.getBoundingClientRect();
  const dx = hR.left + hR.width / 2 - (spR.left + spR.width / 2),
    dy = hR.top + hR.height / 2 - (spR.top + spR.height / 2);
  const sc = Math.min(hR.width / Math.max(spR.width, 1), hR.height / Math.max(spR.height, 1));
  const spT = sp.querySelector('.sp-title'),
    spH = sp.querySelector('.sp-hint');
  const _sh = D.documentElement.classList.contains('is-shiney');
  if (!_sh && spT) {
    spT.style.transition = 'opacity 0.22s ease';
    spT.style.opacity = '0';
  }
  if (!_sh && spH) {
    spH.style.transition = 'opacity 0.18s ease';
    spH.style.opacity = '0';
  }
  setTimeout(() => {
    spDeck.style.transition = 'transform 0.52s cubic-bezier(0.4,0,0.2,1)';
    spDeck.style.transformOrigin = 'center center';
    spDeck.style.transform = `translate(${dx}px,${dy}px) scale(${sc})`;
    setTimeout(() => hdrDeck.classList.add('visible'), 560);
  }, 200);
}
D.addEventListener('DOMContentLoaded', () => {
  const lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const base = lang.split('-')[0];
  const map = { fr: 'french.txt', en: 'english.txt' };
  const primary = map[lang] || map[base] || 'english.txt';
  const strings = LANGS[primary] || {};
  i18n = strings;
  Q('[data-e]').forEach((el) => (el.innerHTML = EMOJIS[el.dataset.e] || ''));
  State.init();
  shineyMode = Rnd(State.cfg.seed)() < 0.01;
  Q('.hub-btn[data-pick-version]').forEach((btn) =>
    btn.addEventListener('click', () => __pickVersion(btn.dataset.pickVersion, btn))
  );
  if (!LS.getItem(VER_KEY)) {
    E('__hub').style.display = 'flex';
    tr();
    E('__hub-sub').textContent = T('ver_pick');
    E('__hub-lbl-full').textContent = T('ver_full');
    E('__hub-desc-full').textContent = T('ver_full_d');
    E('__hub-lbl-lite').textContent = T('ver_lite');
    E('__hub-desc-lite').textContent = T('ver_lite_d');
  } else {
    __initApp();
  }
});
function __pickVersion(v, btn) {
  if (initLocked) return;
  initLocked = true;
  Q('.hub-btn').forEach((b) => {
    b.style.pointerEvents = 'none';
    b.style.opacity = '.5';
  });
  LITE_MODE = v === 'lite';
  LS.setItem(VER_KEY, v);
  D.documentElement.classList.remove('lite-mode', 'full-mode');
  D.documentElement.classList.add(LITE_MODE ? 'lite-mode' : 'full-mode');
  const hub = E('__hub'),
    card = E('__hub-card'),
    splash = E('splash');
  if (btn) {
    const r = btn.getBoundingClientRect(),
      vw = window.innerWidth,
      vh = window.innerHeight;
    const cx = r.left + r.width / 2,
      cy = r.top + r.height / 2;
    const scale =
      Math.ceil(
        Math.max((2 * Math.max(cx, vw - cx)) / r.width, (2 * Math.max(cy, vh - cy)) / r.height)
      ) + 2;
    const bg =
      v === 'full'
        ? 'linear-gradient(135deg,#4f52d3,#6366f1)'
        : 'linear-gradient(135deg,#831843,#be185d)';
    const el = C('div');
    el.style.cssText = `position:fixed;top:${r.top}px;left:${r.left}px;width:${r.width}px;height:${r.height}px;border-radius:16px;z-index:19999;pointer-events:none;background:${bg};transform-origin:center center;will-change:transform;transition:none`;
    D.body.appendChild(el);
    card.style.transition = 'opacity 0.3s ease';
    card.style.opacity = '0';
    requestAnimationFrame(() => {
      el.style.transition = 'transform 0.55s cubic-bezier(0.4,0,0.2,1),border-radius 0.55s ease';
      el.style.transform = `scale(${scale})`;
      el.style.borderRadius = '0';
      setTimeout(() => {
        splash.style.cssText = 'opacity:0;z-index:10000;display:flex;transition:none';
        requestAnimationFrame(() => {
          splash.style.transition = 'opacity 0.45s ease';
          splash.style.opacity = '1';
          if (shineyMode) __playShineySplash();
        });
      }, 350);
      setTimeout(() => {
        el.style.transition = 'opacity 0.4s ease';
        el.style.opacity = '0';
      }, 400);
      setTimeout(() => {
        el.remove();
        hub.style.display = 'none';
        splash.style.zIndex = '';
        splash.style.transition = '';
        __initApp(true);
      }, 820);
    });
  } else {
    hub.style.display = 'none';
    __initApp();
  }
}
const DEFAULT_CFG = {
  albums:     24,
  mode:       'cross',
  gold_ids:   [],
  gold_ex:    [],
  hidden:     [],
  setup_done: false,
  ambiance:   0,
  ambStatic:  false,
  seed:       0,
  usersList:  [],
};
const State = {
  cfg: { ...DEFAULT_CFG, seed: Date.now() },
  usr: {},
  dupCache: null,
  goldCache: null,
  getGoldSet() {
    if (!this.goldCache) this.goldCache = new Set(this.cfg.gold_ids);
    return this.goldCache;
  },
  getDupSet() {
    if (this.dupCache) return this.dupCache;
    const dupes = new Set();
    for (const usr of Object.values(this.usr)) {
      if (!usr?.state) continue;
      for (const [id, st] of Object.entries(usr.state)) {
        if (st === 2) dupes.add(+id);
      }
    }
    return (this.dupCache = dupes);
  },
  init() {
    try {
      const c = JSON.parse(LS.getItem(STORAGE.CFG));
      if (c) ((this.cfg = { ...this.cfg, ...c }), this.cfg.seed || (this.cfg.seed = Date.now()));
    } catch {  }
    if (!this.cfg.usersList.length) this.cfg.usersList = [`${T('ply')} 1`];
    for (const name of this.cfg.usersList) {
      const id = name.replace(/\s/g, '');
      try {
        const saved = JSON.parse(LS.getItem(STORAGE.USER + id));
        this.usr[id] = { state: {}, nums: {}, ...saved };
      } catch {
        this.usr[id] = { state: {}, nums: {} };
      }
    }
  },
  saveCfg() {
    LS.setItem(STORAGE.CFG, JSON.stringify(this.cfg));
  },
  saveUser(u) {
    if (this.usr[u]) LS.setItem(STORAGE.USER + u, JSON.stringify(this.usr[u]));
  },
  setGold(id, v) {
    const s = new Set(this.cfg.gold_ids);
    v ? s.add(id) : s.delete(id);
    this.cfg.gold_ids = [...s];
    this.goldCache = null;
    this.saveCfg();
  },
  updateCard(u, c, v, n = false) {
    if (!this.usr[u]) return;
    if (n) {
      if (v) this.usr[u].nums[c] = v;
      else delete this.usr[u].nums[c];
    } else {
      const old = this.usr[u].state[c];
      if (v === 0) delete this.usr[u].state[c];
      else this.usr[u].state[c] = v;
      if (old === 2 || v === 2) this.dupCache = null;
    }
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.saveUser(u), 300);
  },
};
function buildAlbumPills(container, onChange) {
  container.innerHTML = '';
  for (let v = ALBUM_MIN; v <= ALBUM_MAX; v++) {
    const b = C('button');
    b.className = 'alb-pill' + (State.cfg.albums === v ? ' active' : '');
    b.textContent = v;
    b.onclick = () => {
      container.querySelectorAll('.alb-pill').forEach((p) =>
        p.classList.toggle('active', +p.textContent === v)
      );
      onChange(v);
    };
    container.appendChild(b);
  }
}
function closeAllPopovers() {
  Q('.popover').forEach((p) => p.classList.remove('show'));
}
function withExpandedState(fn) {
  const expanded = [...Q('.glass-card.expanded')].map((c) => ({
    sec:  c.dataset.sec,
    blur: c.classList.contains('blur-active'),
  }));
  fn();
  expanded.forEach(({ sec, blur }) => {
    const c = D.querySelector(`.glass-card[data-sec="${sec}"]`);
    if (!c) return;
    c.classList.add('expanded');
    if (blur) c.classList.add('blur-active');
  });
}
const isSetupOpen = () => E('setup-mod').classList.contains('open');
window.PlayerManager = {
  tu: [],
  newIdxs: new Set(),
  dragSrc: null,
  touchSrc: null,
  touchClone: null,
  open() {
    this.tu = [...State.cfg.usersList];
    const pv = E('pop-players');
    const fromH = pv.offsetHeight;
    E('players-view-head').style.display = 'none';
    E('players-list').style.display = 'none';
    E('players-edit-head').style.display = 'block';
    E('players-edit-list').style.display = 'flex';
    E('players-save-footer').style.display = 'flex';
    pv.style.width = '320px';
    pv.classList.add('show');
    this.render();
    const maxH = window.innerHeight - 110;
    const toH = Math.min(pv.scrollHeight, maxH);
    pv.animate([{ height: fromH + 'px' }, { height: toH + 'px' }], {
      duration: 300,
      easing: 'cubic-bezier(0.25,0.8,0.25,1)',
    });
  },
  close() {
    this.newIdxs.clear();
    const pv = E('pop-players');
    const fromH = pv.offsetHeight;
    E('players-view-head').style.display = 'block';
    E('players-list').style.display = 'block';
    E('players-edit-head').style.display = 'none';
    E('players-edit-list').style.display = 'none';
    E('players-save-footer').style.display = 'none';
    pv.style.width = '280px';
    const toH = pv.scrollHeight;
    pv.animate([{ height: fromH + 'px' }, { height: toH + 'px' }], {
      duration: 300,
      easing: 'cubic-bezier(0.25,0.8,0.25,1)',
    });
  },
  render() {
    const list = E('players-edit-list');
    const frag = D.createDocumentFragment();
    this.tu.forEach((u, i) => {
      const r = C('li');
      r.className = 'pm-row' + (this.newIdxs.has(i) ? ' pm-new' : '');
      r.draggable = true;
      r.dataset.idx = i;
      r.innerHTML = `<span class="pm-handle">⠿</span><input type="text" class="pm-input pm-inp" value="${esc(u)}" data-idx="${i}"><button class="mini-btn danger pm-del" data-idx="${i}" ${this.tu.length <= 1 ? 'disabled' : ''}>${EMOJIS.cls}</button>`;
      this._bindDrag(r);
      this._bindTouch(r.querySelector('.pm-handle'), r);
      frag.appendChild(r);
    });
    list.innerHTML = '';
    list.appendChild(frag);
    list.onchange = (e) => {
      const inp = e.target.closest('.pm-inp');
      if (inp) this.tu[+inp.dataset.idx] = inp.value.trim() || `${T('ply')} ${+inp.dataset.idx + 1}`;
    };
    list.onclick = (e) => {
      const btn = e.target.closest('.pm-del');
      if (btn && !btn.disabled && this.tu.length > 1) {
        this.tu.splice(+btn.dataset.idx, 1);
        this.render();
      }
    };
  },
  _bindDrag(r) {
    r.addEventListener('dragstart', (e) => {
      this.dragSrc = r;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', r.dataset.idx);
      setTimeout(() => r.classList.add('pm-dragging'), 0);
    });
    r.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (r !== this.dragSrc) {
        Q('.pm-row').forEach((el) => el.classList.remove('pm-drag-over'));
        r.classList.add('pm-drag-over');
      }
    });
    r.addEventListener('drop', (e) => {
      e.preventDefault();
      if (r !== this.dragSrc) {
        const item = this.tu.splice(+this.dragSrc.dataset.idx, 1)[0];
        this.tu.splice(+r.dataset.idx, 0, item);
        this.render();
      }
    });
    r.addEventListener('dragend', () => {
      Q('.pm-row').forEach((el) => el.classList.remove('pm-dragging', 'pm-drag-over'));
      this.dragSrc = null;
    });
  },
  _bindTouch(handle, row) {
    const opts = { passive: false };
    handle.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.touchSrc = row;
      const { top, left, width } = row.getBoundingClientRect();
      const clone = row.cloneNode(true);

    const p = E('gold-note-panel'), h = E('gold-click-hint'), g = E('gold-grid-ctn'), b = E('btn-gold-note');
    if (p) {
      p.style.display = 'flex';
      p.className = p.className.replace(/\bcolor-[gr]\b/g, '').trim();
      p.classList.add('color-' + this.noteColor);
    }
    if (h) h.style.display = 'none';
    if (g) g.style.display = 'none';
    if (b) { b.style.background = 'rgba(99,102,241,.25)'; b.style.borderColor = 'var(--p)'; b.style.color = '#fff'; }
    const d = this.loadData(), ed = E('gn-editor');
    if (ed) {
      ed.innerHTML = this.rawToHtml(d.text);
      setTimeout(() => ed.focus(), 80);
    }
    this.rebuildNames();
  },
  close() {
    this.panelOpen = false;
    const p = E('gold-note-panel'), h = E('gold-click-hint'), g = E('gold-grid-ctn'), b = E('btn-gold-note');
    if (p) p.style.display = 'none';
    if (h) h.style.display = '';
    if (g) g.style.display = '';
    if (b) { b.style.background = ''; b.style.borderColor = ''; b.style.color = ''; }
  },
  toggle() { this.panelOpen ? this.close() : this.open(); },
  setColor(col) {
    this.noteColor = col;
    const g = E('btn-gn-green'), r = E('btn-gn-red'), lbl = E('gn-color-lbl');
    if (g) g.classList.toggle('active', col === 'g');
    if (r) r.classList.toggle('active', col === 'r');
    if (lbl) lbl.textContent = T(col === 'g' ? 'gn_col_g' : 'gn_col_r');
    const p = E('gold-note-panel');
    if (p) {
      p.className = p.className.replace(/\bcolor-[gr]\b/g, '').trim();
      p.classList.add('color-' + col);
    }
  },
  rebuildNames() {
    const list = E('gn-names-list'), wrap = E('gn-names-wrap');
    if (!list) return;
    const gl = this.getGoldList(), d = this.loadData();
    if (wrap) wrap.style.display = gl.length ? '' : 'none';
    if (!gl.length) return;
    list.innerHTML = '';
    while (d.names.length < gl.length) d.names.push('');
    gl.forEach((alb, idx) => {
      const row = C('div');
      row.className = 'gn-name-row';
      const lbl = C('span');
      lbl.className = 'gn-alb-badge';
      lbl.textContent = `${T('gn_alb')} ${alb}`;
      const inp = C('input');
      inp.className = 'gn-name-inp';
      inp.type = 'text';
      inp.placeholder = T('gn_name_ph');
      inp.value = d.names[idx] || '';
      inp.oninput = () => {
        const nd = this.loadData();
        while (nd.names.length <= idx) nd.names.push('');
        nd.names[idx] = inp.value;
        this.saveData(nd);
      };
      row.appendChild(lbl);
      row.appendChild(inp);
      list.appendChild(row);
    });
  },
  _charOffset(ed, container, offset) {
    let total = 0;
    const iter = D.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = iter.nextNode())) {
      if (node === container) return total + offset;
      total += node.nodeValue.length;
    }
    return total + offset;
  },
  _rangeFromCharOffsets(ed, start, end) {
    const r = D.createRange();
    let offset = 0, startSet = false, endSet = false;
    const iter = D.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = iter.nextNode())) {
      const len = node.nodeValue.length;
      if (!startSet && offset + len >= start) {
        r.setStart(node, start - offset);
        startSet = true;
      }
      if (startSet && !endSet && offset + len >= end) {
        r.setEnd(node, end - offset);
        endSet = true;
        break;
      }
      offset += len;
    }
    if (!startSet || !endSet) r.collapse(true);
    return r;
  },
  toggleDrawer() {
    const drawer = E('gn-drawer'), btn = E('btn-gn-drawer');
    if (!drawer) return;
    const isOpen = drawer.classList.toggle('open');
    if (btn) btn.classList.toggle('open', isOpen);
  },
  genStructure() {
    const gl = this.getGoldList(), d = this.loadData(), ed = E('gn-editor');
    if (!gl.length) { UI.toast(T('gn_no_gold')); return; }
    while (d.names.length < gl.length) d.names.push('');
    const hasNames = d.names.some((n) => n && n.trim());
    const newLines = gl.map((alb, idx) => {
      let l = `${T('gn_alb_full')} ${alb}`;
      if (hasNames && d.names[idx] && d.names[idx].trim()) l += `. ${d.names[idx].trim()}`;
      return l;
    }).join('\n');
    if (!ed) return;
    const existing = this.domToRaw(ed).replace(/\n+$/, '');
    const combined = existing ? existing + '\n' + newLines : newLines;
    ed.innerHTML = this.rawToHtml(combined);
    d.text = combined;
    this.saveData(d);
    ed.scrollTop = ed.scrollHeight;
  },
};
